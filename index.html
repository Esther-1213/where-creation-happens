<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#171c18" />

  <title>Where Does Creation Happen? — Living Score</title>

  <link rel="stylesheet" href="./style.css" />
</head>

<body>s
  <header>
    <a href="#" id="home" class="wordmark">
      LL<span>↗</span> / LIVING SCORE
    </a>

    <div class="edition">
      SEOUL · 2026<br />
      INTERACTIVE EXHIBITION / 01
    </div>

    <nav aria-label="전시 메뉴">
      <button id="rulesBtn" type="button">
        작곡의 규칙 ↗
      </button>

      <button
        id="langBtn"
        type="button"
        aria-label="Switch language"
      >
        EN
      </button>
    </nav>
  </header>

  <main id="app"></main>

  <footer>
    <span>PLANT PHYSIOLOGY × HUMAN DECISION</span>
    <span id="footnote">생리적 사실에서, 당신의 해석으로.</span>
    <span>정예원 · LLLounge Seoul</span>
  </footer>

  <dialog id="rules">
    <button
      class="close"
      id="closeRules"
      type="button"
      aria-label="닫기"
    >
      ×
    </button>

    <p class="eyebrow">
      THE AUTHOR'S SCORE / 작가가 정한 규칙
    </p>

    <h2>
      자유에는<br />
      설계된 경계가 있다.
    </h2>

    <div id="rulesContent"></div>
  </dialog>

  <div
    id="toast"
    role="status"
    aria-live="polite"
  ></div>

  <noscript>
    이 전시는 JavaScript를 활성화해야 체험할 수 있습니다.
  </noscript>

  <!-- 순서를 유지해주세요. 뒤의 파일이 앞의 파일을 사용합니다. -->
  <script src="./data.js"></script>
  <script src="./engine.js"></script>
  <script src="./piano-pcm.js"></script>
  <script src="./compat-audio.js"></script>
  <script src="./app.js"></script>
</body>
</html>
